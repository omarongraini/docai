[project]
name = "chatpdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omar Ongraini", email = "omarongraini@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "google-genai>=2.33.0",
    "openai>=3.39.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "streamlit>=1.66.1",
]

[project.scripts]
chatpdf = "chatpdf:main"
reindex = "chatpdf.tools.reindex:reindex_all"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
extend-exclude = ["migrations"]
